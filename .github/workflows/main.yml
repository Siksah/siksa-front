name: Deploy GCP VM
run-name: "[${{ github.ref_name }}] [${{ github.event.head_commit.message }}] [${{ github.actor }}]"

on:
  push:
    branches:
      - '**'

  # 💡 수동 실행(Manual Trigger) 옵션 추가 
  workflow_dispatch:
    inputs:
      commit_message:
        description: '임의 커밋 메시지'
        required: true
        default: 'Manual deploy' # 입력이 없을 경우 기본값

permissions:
  contents: read

jobs:
  # 1. pull_request 이벤트에서 레이블 검사만 하는 Job
  check_pr_label:
    runs-on: ubuntu-latest
    
    steps:
      - name: Label Check Passed
        run: echo "Label check passed for PR."

  deploy:
    # 이 작업이 실행될 가상 환경 정의 (GitHub Runner)
    runs-on: ubuntu-latest

    steps:
      # Git 레포지토리의 코드를 Runner 환경으로 복제
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # 구글 클라우드 인증 단계
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # gcloud SDK 설정
      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      # Artifact Registry 인증
      - name: 'Docker Auth'
        run: |-
          gcloud auth configure-docker asia-northeast1-docker.pkg.dev
      
      # Docker 빌드 환경 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
          
      # 프론트엔드 이미지 빌드 및 푸시 (frontend-app)
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfiles/frontend.Dockerfile 
          push: true
          # 형식: [리전]-docker.pkg.dev/[프로젝트ID]/[저장소명]/[이미지명]:latest
          tags: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/siksa/siksa-frontend-app:latest
          build-args: VITE_API_BASE_URL=${{ secrets.VITE_FRONTEND_API_BASE_URL }}
          no-cache: true

      # Cloud Run에 직접 배포
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: siksa-frontend # 서비스 이름
          image: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/siksa/siksa-frontend-app:latest
          region: asia-northeast1 # 도쿄 리전
          flags: '--allow-unauthenticated' # 외부 접속 허용 (매우 중요!)